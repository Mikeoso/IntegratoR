name: Publish NuGet Packages

on:
  # This hotfix line never publishes on push — only on an explicit workflow_dispatch. A maintenance
  # line has no audience for a running prerelease stream, and a half-finished hotfix has no business
  # on the public feed. The jobs below still accept support/** so a dispatched release works.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a stable release (from main, or from a support/** hotfix line)'
        required: false
        type: boolean
        default: false

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Validate release branch
        if: inputs.release && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/support/')
        run: |
          echo "::error::Stable releases can only be created from main or a support/** hotfix line. Current ref: $GITHUB_REF"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.3.3
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.3.3

      - name: Set package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_RELEASE: ${{ inputs.release }}
          VERSION_STABLE: ${{ steps.gitversion.outputs.majorMinorPatch }}
          VERSION_PRERELEASE: ${{ steps.gitversion.outputs.semVer }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$IS_RELEASE" == "true" ]]; then
            echo "version=$VERSION_STABLE" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=$VERSION_PRERELEASE" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Pack
        run: dotnet pack --configuration Release --no-build --output ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./nupkgs/

  publish:
    runs-on: ubuntu-latest
    needs: pack
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/support/')
    environment: nuget
    permissions:
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: ./nupkgs

      - name: NuGet login (OIDC trusted publishing)
        id: login
        uses: nuget/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    runs-on: ubuntu-latest
    needs: [pack, publish]
    if: needs.pack.outputs.is_release == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/support/'))
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkgs
          path: ./nupkgs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.pack.outputs.version }}
          name: v${{ needs.pack.outputs.version }}
          generate_release_notes: true
          # This branch only ever produces hotfixes, which ship after the newer main-line releases
          # and must not take GitHub's "Latest release" badge from them.
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          files: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
