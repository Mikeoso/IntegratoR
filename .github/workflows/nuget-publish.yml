name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false

env:
  DOTNET_VERSION: '10.0.x'
  CONFIGURATION: Release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Run tests
      run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

    - name: Pack IntegratoR.Abstractions
      run: dotnet pack IntegratoR.Abstractions/IntegratoR.Abstractions.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./packages

    - name: Pack IntegratoR.Application
      run: dotnet pack IntegratoR.Application/IntegratoR.Application.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./packages

    - name: Pack IntegratoR.OData
      run: dotnet pack IntegratoR.OData/IntegratoR.OData.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./packages

    - name: Pack IntegratoR.OData.FO
      run: dotnet pack IntegratoR.OData.FO/IntegratoR.OData.FO.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./packages

    - name: Pack IntegratoR.RELion
      run: dotnet pack IntegratoR.RELion/IntegratoR.RELion.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output ./packages

    - name: Publish to NuGet
      run: |
        for package in ./packages/*.nupkg; do
          dotnet nuget push "$package" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        done
