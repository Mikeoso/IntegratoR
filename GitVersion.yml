# GitVersion Configuration

# Define Assembly-Version schema (Major.Minor.Patch.0)
assembly-versioning-scheme: MajorMinorPatch
assembly-file-versioning-scheme: MajorMinorPatch

workflow: GitHubFlow/v1
mode: ContinuousDelivery
# Bumped to 3.0.0: the configurable OData $batch redesign is a breaking public-API change — batch
# operations now return Result<BatchOutcome> instead of Result across IBatchService, ODataService,
# the batch commands/handlers, and IODataClientAdapter (BatchFailureMode param). This pins the next
# stable release to a MAJOR. See CHANGELOG.md "Changed - Breaking".
next-version: 3.0.0

branches:
  main:
    label: 'ci'

ignore:
  sha: []
